<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍪 Clicker Game · Simple Clicker</title>
<title>Vladislav Klimko0 Boop Clicker Game</title>
<meta name="description" content="Грайте в Boop Clicker від vladislavklimko0. Простий та веселий клікер печива прямо у вашому браузері на GitHub Pages!">
  <meta name="google-site-verification" content="4S-SVOWfuvx6a1JOvhWgzchmrosWvZzqC5nj_cPabco" />
  <meta name="description" content="A simple cookie clicker game with upgrades and auto-clicker progression.">
  <meta name="keywords" content="cookie clicker, game, clicker game, simple web game">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <div class="score-panel">
      <div class="score-label">Cookies</div>
      <div id="scoreDisplay" class="score-value">0</div>
    </div>

    <div class="click-area">
      <button class="click-button" id="clickButton" aria-label="Click to get cookies">🍪</button>
    </div>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-label">Per click</div>
        <div class="stat-value" id="cpcDisplay">1</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Per sec</div>
        <div class="stat-value" id="cpsDisplay">0</div>
      </div>
    </div>

    <div class="upgrades-section">
      <div class="upgrades-title">⚡ upgrades</div>
      <div class="upgrade-grid">
        <button class="upgrade-btn" id="upgradeClickBtn">
          <span class="upgrade-name">🔨 Click power</span>
          <span class="upgrade-cost" id="clickCost">🍪 15</span>
        </button>
        <button class="upgrade-btn" id="upgradeAutoBtn">
          <span class="upgrade-name">⚙️ Auto clicker</span>
          <span class="upgrade-cost" id="autoCost">🍪 30</span>
        </button>
      </div>
    </div>

    <button class="reset-btn" id="resetButton">
      <span>⟲</span> Reset game
    </button>
    <div class="footer-note">click the cookie · buy upgrades</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
