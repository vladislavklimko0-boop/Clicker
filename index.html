<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍪 Clicker Game · Simple Clicker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #1a2634 0%, #0f1722 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 16px;
      margin: 0;
    }

    .game-container {
      background: rgba(22, 30, 40, 0.8);
      backdrop-filter: blur(8px);
      border-radius: 64px 64px 48px 48px;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.08);
      padding: 32px 24px 40px;
      max-width: 700px;
      width: 100%;
      border: 1px solid rgba(255, 215, 100, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .score-panel {
      background: #0e141c;
      border-radius: 200px;
      padding: 14px 40px;
      margin-bottom: 20px;
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.8), 0 8px 18px #00000030;
      border: 1px solid #ffd96640;
      width: fit-content;
      min-width: 240px;
      text-align: center;
    }

    .score-label {
      color: #aab7c9;
      font-weight: 400;
      letter-spacing: 2px;
      font-size: 0.9rem;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .score-value {
      font-size: 4rem;
      font-weight: 800;
      color: #ffd966;
      text-shadow: 0 0 20px #ffb34780, 0 4px 0 #7a4d00;
      line-height: 1;
      transition: transform 0.1s ease;
      word-break: break-word;
    }

    .score-value.small {
      font-size: 3rem;
    }

    .click-area {
      margin: 20px 0 10px;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .click-button {
      background: radial-gradient(circle at 30% 25%, #ffe28c, #e6a017);
      border: none;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 18px 0 #8b5a00, 0 25px 30px #00000080, inset 0 -8px 15px #b87c1b, inset 0 10px 20px #fff3bf;
      font-size: 5.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.08s linear;
      outline: 2px solid #ffd96670;
      outline-offset: 6px;
      transform: translateY(0);
      color: #3a2a00;
      font-weight: 600;
      line-height: 1;
      padding-bottom: 12px;
      user-select: none;
    }

    .click-button:active {
      transform: translateY(8px);
      box-shadow: 0 10px 0 #8b5a00, 0 18px 25px #000000cc, inset 0 -5px 12px #b87c1b, inset 0 10px 20px #fff3bf;
    }

    .click-button:disabled {
      filter: grayscale(0.7);
      opacity: 0.8;
      transform: translateY(4px);
      box-shadow: 0 10px 0 #5c3d00, 0 12px 20px #000000;
      cursor: not-allowed;
    }

    .stats {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin: 10px 0 20px;
      background: #0b1118;
      padding: 16px 32px;
      border-radius: 120px;
      border: 1px solid #2f3c4e;
      box-shadow: inset 0 2px 6px #000000, 0 6px 12px #00000040;
    }

    .stat-item {
      text-align: center;
      min-width: 100px;
    }

    .stat-label {
      color: #8b9bb0;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .stat-value {
      color: #eef3fc;
      font-weight: 700;
      font-size: 1.8rem;
      line-height: 1.3;
      text-shadow: 0 2px 0 #00000050;
    }

    .upgrades-section {
      width: 100%;
      margin-top: 12px;
    }

    .upgrades-title {
      color: #b7c6db;
      font-weight: 400;
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 14px;
    }

    .upgrade-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }

    .upgrade-btn {
      background: #1d2a38;
      border: 2px solid #3b4e62;
      border-radius: 36px;
      padding: 14px 24px;
      color: #d9e6f5;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      box-shadow: 0 6px 0 #0b1016, 0 8px 16px #00000040;
      flex: 1 1 140px;
      min-width: 130px;
      font-family: inherit;
    }

    .upgrade-btn:hover:not(:disabled) {
      background: #253749;
      border-color: #ffd96680;
      transform: scale(1.02);
    }

    .upgrade-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0b1016, 0 6px 12px #00000060;
    }

    .upgrade-btn:disabled {
      opacity: 0.45;
      filter: grayscale(0.8);
      cursor: not-allowed;
      transform: translateY(2px);
      box-shadow: 0 4px 0 #0b1016, 0 6px 10px #00000040;
      border-color: #2a3a4a;
    }

    .upgrade-name {
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }

    .upgrade-cost {
      font-size: 0.85rem;
      background: #00000050;
      padding: 4px 12px;
      border-radius: 40px;
      color: #ffd966;
      font-weight: 700;
      border: 1px solid #ffd96630;
    }

    .reset-btn {
      margin-top: 28px;
      background: none;
      border: 1px solid #495e77;
      color: #9eb1c7;
      padding: 10px 28px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
    }

    .reset-btn:hover {
      background: #1f2c3b;
      color: #f0d99b;
      border-color: #ffd96660;
    }

    .footer-note {
      color: #38495e;
      font-size: 0.7rem;
      margin-top: 16px;
      letter-spacing: 0.5px;
    }

    @media (max-width: 550px) {
      .game-container {
        padding: 20px 16px 28px;
        border-radius: 40px 40px 32px 32px;
      }
      .click-button {
        width: 160px;
        height: 160px;
        font-size: 4rem;
        padding-bottom: 8px;
      }
      .score-value {
        font-size: 3rem;
      }
      .score-value.small {
        font-size: 2.3rem;
      }
      .stats {
        gap: 12px;
        padding: 12px 16px;
      }
      .stat-item {
        min-width: 70px;
      }
      .stat-value {
        font-size: 1.4rem;
      }
      .upgrade-btn {
        padding: 12px 16px;
        min-width: 110px;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <!-- score display -->
    <div class="score-panel">
      <div class="score-label">Cookies</div>
      <div id="scoreDisplay" class="score-value">0</div>
    </div>

    <!-- click area -->
    <div class="click-area">
      <button class="click-button" id="clickButton" aria-label="Click to get cookies">🍪</button>
    </div>

    <!-- stats -->
    <div class="stats">
      <div class="stat-item">
        <div class="stat-label">Per click</div>
        <div class="stat-value" id="cpcDisplay">1</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Per sec</div>
        <div class="stat-value" id="cpsDisplay">0</div>
      </div>
    </div>

    <!-- upgrades -->
    <div class="upgrades-section">
      <div class="upgrades-title">⚡ upgrades</div>
      <div class="upgrade-grid">
        <button class="upgrade-btn" id="upgradeClickBtn">
          <span class="upgrade-name">🔨 Click power</span>
          <span class="upgrade-cost" id="clickCost">🍪 15</span>
        </button>
        <button class="upgrade-btn" id="upgradeAutoBtn">
          <span class="upgrade-name">⚙️ Auto clicker</span>
          <span class="upgrade-cost" id="autoCost">🍪 30</span>
        </button>
      </div>
    </div>

    <!-- reset -->
    <button class="reset-btn" id="resetButton">
      <span>⟲</span> Reset game
    </button>
    <div class="footer-note">click the cookie · buy upgrades</div>
  </div>

  <script>
    (function() {
      // ----- game state -----
      let cookies = 0;                 // current cookies
      let clickPower = 1;             // cookies per manual click
      let autoRate = 0;               // cookies per second (from auto clicker)
      
      // upgrade costs
      let clickUpgradeCost = 15;       // cost to next click power upgrade
      let autoUpgradeCost = 30;       // cost to next auto clicker upgrade
      
      // multipliers (increment per upgrade)
      const CLICK_POWER_STEP = 1;      // +1 per click upgrade
      const AUTO_RATE_STEP = 1;        // +1 cookie per second per auto upgrade

      // DOM elements
      const scoreDisplay = document.getElementById('scoreDisplay');
      const cpcDisplay = document.getElementById('cpcDisplay');
      const cpsDisplay = document.getElementById('cpsDisplay');
      const clickButton = document.getElementById('clickButton');
      
      const upgradeClickBtn = document.getElementById('upgradeClickBtn');
      const upgradeAutoBtn = document.getElementById('upgradeAutoBtn');
      const clickCostSpan = document.getElementById('clickCost');
      const autoCostSpan = document.getElementById('autoCost');
      const resetButton = document.getElementById('resetButton');

      // ----- helper: format big numbers (simple) -----
      function formatNumber(value) {
        if (value >= 1e9) {
          return (value / 1e9).toFixed(1) + 'B';
        } else if (value >= 1e6) {
          return (value / 1e6).toFixed(1) + 'M';
        } else if (value >= 1e4) {
          return (value / 1e3).toFixed(1) + 'K';
        } else {
          return Math.floor(value).toString(); // keep it integer-looking
        }
      }

      // ----- update UI (score, cpc, cps, button states, costs) -----
      function updateUI() {
        // update cookie display, apply smaller class if number is long
        const formattedCookies = formatNumber(cookies);
        scoreDisplay.textContent = formattedCookies;
        if (formattedCookies.length > 6) {
          scoreDisplay.classList.add('small');
        } else {
          scoreDisplay.classList.remove('small');
        }

        // update per click and per sec
        cpcDisplay.textContent = clickPower;
        cpsDisplay.textContent = autoRate;

        // update cost labels
        clickCostSpan.textContent = `🍪 ${clickUpgradeCost}`;
        autoCostSpan.textContent = `🍪 ${autoUpgradeCost}`;

        // disable upgrade buttons if not enough cookies
        upgradeClickBtn.disabled = cookies < clickUpgradeCost;
        upgradeAutoBtn.disabled = cookies < autoUpgradeCost;
      }

      // ----- add cookies (positive or negative) -----
      function addCookies(amount) {
        cookies = Math.max(0, cookies + amount); // never negative
        updateUI();
      }

      // ----- manual click handler -----
      function handleClick() {
        addCookies(clickPower);
        // micro feedback: slight button animation via class can be added, but active pseudo class does it
      }

      // ----- upgrade click power -----
      function buyClickUpgrade() {
        if (cookies < clickUpgradeCost) return;
        cookies -= clickUpgradeCost;
        clickPower += CLICK_POWER_STEP;
        
        // increase cost: cost grows ~1.6x, rounded
        clickUpgradeCost = Math.round(clickUpgradeCost * 1.65);
        // ensure minimum increase of 2
        if (clickUpgradeCost < 2) clickUpgradeCost = 2;

        updateUI();
      }

      // ----- upgrade auto clicker -----
      function buyAutoUpgrade() {
        if (cookies < autoUpgradeCost) return;
        cookies -= autoUpgradeCost;
        autoRate += AUTO_RATE_STEP;

        // increase cost: cost grows ~1.8x
        autoUpgradeCost = Math.round(autoUpgradeCost * 1.85);
        if (autoUpgradeCost < 5) autoUpgradeCost = 5;

        updateUI();
      }

      // ----- reset game to initial state -----
      function resetGame() {
        cookies = 0;
        clickPower = 1;
        autoRate = 0;
        clickUpgradeCost = 15;
        autoUpgradeCost = 30;
        updateUI();
      }

      // ----- auto clicker interval (runs every second) -----
      function autoClickTick() {
        if (autoRate > 0) {
          addCookies(autoRate);
        }
        // even if autoRate is 0, we could skip, but it's fine
      }

      // ----- event listeners -----
      clickButton.addEventListener('click', handleClick);

      upgradeClickBtn.addEventListener('click', buyClickUpgrade);
      upgradeAutoBtn.addEventListener('click', buyAutoUpgrade);
      
      resetButton.addEventListener('click', resetGame);

      // keyboard support: press space or enter on click button (already native for button, but we prevent double trigger on some browsers)
      clickButton.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();  // prevent page scroll / double activation
          handleClick();
        }
      });

      // ----- start the auto clicker interval (1 second) -----
      setInterval(autoClickTick, 1000);

      // ----- initial UI update -----
      updateUI();

      // small extra: show a floating "+1" on click? not necessary, but could be nice
      // but we keep it clean and simple. 
      // however to improve feedback, we can add a quick scale effect on the cookie via JS
      // but the :active pseudo class already provides nice press effect.

      // Additional touch: dynamic tooltip for disabled buttons? Not needed.

      // Ensure that the click button doesn't get stuck in :focus style (optional)
      // No extra code needed.
    })();
  </script>
</body>
</html>
